<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Hotspot - Minimalist Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
        }
        
        body {
            background-color: #f8fafc;
            background-image: radial-gradient(rgba(79, 70, 229, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #0f172a;
        }

        .container {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            padding: 36px;
            max-width: 440px;
            width: 100%;
            position: relative;
        }

        .header { 
            text-align: center; 
            margin-bottom: 24px; 
        }
        
        .header h1 { 
            color: #0f172a; 
            font-size: 20px; 
            font-weight: 700; 
            margin-bottom: 6px; 
        }
        
        .header p { 
            color: #64748b; 
            font-size: 13px; 
        }

        .form-group { 
            margin-bottom: 14px; 
        }
        
        .form-group label { 
            display: block; 
            margin-bottom: 6px; 
            color: #475569; 
            font-weight: 600; 
            font-size: 12px; 
        }
        
        .form-group input {
            width: 100%; 
            padding: 11px 14px; 
            background: #f8fafc; 
            border: 1px solid #e2e8f0;
            border-radius: 8px; 
            font-size: 14px; 
            color: #0f172a; 
            outline: none; 
            transition: all 0.2s ease;
        }
        
        .form-group input::placeholder { 
            color: #94a3b8; 
        }
        
        .form-group input:focus { 
            border-color: #4f46e5; 
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); 
            background: #ffffff;
        }

        .btn {
            width: 100%; 
            padding: 12px; 
            background: #4f46e5;
            color: #ffffff; 
            border: none; 
            border-radius: 8px; 
            font-size: 14px; 
            font-weight: 600; 
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 8px;
        }
        
        .btn:hover { 
            background: #4338ca; 
        }
        
        .btn:active { 
            transform: scale(0.99); 
        }
        
        .btn:disabled { 
            background: #cbd5e1; 
            color: #94a3b8; 
            cursor: not-allowed; 
        }

        .message { 
            padding: 12px 16px; 
            border-radius: 8px; 
            margin-top: 14px; 
            display: none; 
            font-size: 13px; 
            text-align: center; 
            font-weight: 500; 
        }
        
        .message.success { 
            background: #dcfce7; 
            color: #15803d; 
            border: 1px solid #bbf7d0; 
        }
        
        .message.error { 
            background: #fee2e2; 
            color: #dc2626; 
            border: 1px solid #fecaca; 
        }

        .login-link { 
            text-align: center; 
            margin-top: 20px; 
            color: #64748b; 
            font-size: 13px; 
        }
        
        .login-link a { 
            color: #4f46e5; 
            text-decoration: none; 
            font-weight: 600; 
        }
        
        .login-link a:hover { 
            text-decoration: underline; 
        }

        .loading {
            display: inline-block; 
            width: 14px; 
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3); 
            border-radius: 50%; 
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite; 
            margin-right: 6px; 
            vertical-align: middle;
        }
        
        @keyframes spin { 
            to { transform: rotate(360deg); } 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Registrasi Akun</h1>
            <p>Dapatkan akses jaringan hotspot Anda</p>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label for="name">Nama Lengkap</label>
                <input type="text" id="name" name="name" required placeholder="Masukkan nama lengkap">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="Masukkan email">
            </div>

            <div class="form-group">
                <label for="phone">Nomor Telepon</label>
                <input type="tel" id="phone" name="phone" required placeholder="Masukkan nomor telepon">
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Masukkan username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Masukkan password">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Konfirmasi Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Konfirmasi password">
            </div>

            <button type="submit" class="btn" id="submitBtn">
                <span id="btnText">Daftar Sekarang</span>
            </button>
        </form>

        <div class="message" id="message"></div>

        <div class="login-link">
            Sudah punya akun? <a href="login.html">Login di sini</a>
        </div>
    </div>

    <script>
        // ========================================================
        // GANTI URL DI BAWAH DENGAN DOMAIN VERCEL KAMU JIKA SUDAH DEPLOY
        // Contoh: 'https://nama-proyek-kamu.vercel.app'
        // ========================================================
        const BACKEND_URL = window.location.origin.includes('vercel.app') 
            ? window.location.origin 
            : 'https://mikrotik-hostpot-login-done.vercel.app'; // <--- Masukkan domain Vercel di sini

        const form = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const message = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showMessage('Password tidak cocok!', 'error');
                return;
            }

            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                username: document.getElementById('username').value,
                password: password
            };

            // Show loading
            submitBtn.disabled = true;
            btnText.innerHTML = '<span class="loading"></span> Memproses...';

            try {
                // Menembak langsung ke API Vercel Serverless
                const response = await fetch(`${BACKEND_URL}/api/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(data.message + ' Mengalihkan ke halaman login...', 'success');
                    form.reset();

                    // Redirect otomatis ke login.html setelah 2 detik
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                showMessage('Terjadi kesalahan koneksi ke server backend.', 'error');
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'Daftar Sekarang';
            }
        });

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = 'block';

            setTimeout(() => {
                message.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
